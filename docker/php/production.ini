; Production PHP settings for the Portfolio CMS container.

expose_php = Off
; "<?xml" in templates must never be parsed as PHP.
short_open_tag = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 512M
max_execution_time = 120

; Livewire's temporary upload limit is 12 MB; leave headroom for the request body.
upload_max_filesize = 16M
post_max_size = 20M

session.cookie_httponly = On
session.use_strict_mode = On

opcache.enable = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
; Code never changes inside a running container.
opcache.validate_timestamps = 0
