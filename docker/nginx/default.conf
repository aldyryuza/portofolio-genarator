# nginx for the Portfolio CMS. TLS is expected to terminate at the host's reverse proxy.

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    server_tokens off;
    charset utf-8;
    # Livewire uploads are capped at 12 MB by the app; allow some request overhead.
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    # Hashed Vite assets never change.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }

    # Never serve dotfiles (.env, .git, ...) even if they end up in public/.
    location ~ /\.(?!well-known) {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
    }

    # Any other .php file is not an entry point.
    location ~ \.php$ {
        return 404;
    }
}
